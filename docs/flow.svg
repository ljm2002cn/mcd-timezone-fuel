<svg viewBox="0 0 680 470" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>麦麦时差补给官的时区决策链路</title>
<rect width="680" height="470" fill="#12111A"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="30" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="500" fill="#CECBF6">麦麦时差补给官 · 时区决策链路</text>
<g>
<rect x="40" y="50" width="270" height="56" rx="8" fill="#26215C" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="175" y="70" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="500" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">Step 1 · 建立时区坐标</text>
<text x="175" y="90" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">now-time-info + 询问用户时区</text>
</g>
<g>
<rect x="370" y="50" width="270" height="56" rx="8" fill="#26215C" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="505" y="70" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="500" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">Step 2 · 判定时段</text>
<text x="505" y="90" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">8 个时段各自一套策略</text>
</g>
<path d="M310 78 L364 78" fill="none" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="128" width="600" height="72" rx="12" fill="#04342C" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="148" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="500" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">Step 3 · MCP 真实数据并行拉取</text>
<text x="340" y="170" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">query-meals · list-nutrition-foods · available-coupons</text>
<text x="340" y="187" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">query-nearby-stores · campaign-calendar · query-store-coupons</text>
<path d="M175 106 L175 124" fill="none" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M505 106 L505 124" fill="none" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="224" width="190" height="86" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="135" y="244" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" font-weight="500" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">A 档 · 轻负担</text>
<text x="135" y="265" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">深夜/清晨强制</text>
<text x="135" y="283" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">禁重油炸物</text>
