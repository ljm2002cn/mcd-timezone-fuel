<text x="340" y="268" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">日常推荐</text>
<text x="340" y="288" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">可叠加优惠</text>
<rect x="450" y="224" width="190" height="86" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="545" y="244" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" font-weight="500" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">C 档 · 放纵</text>
<text x="545" y="268" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">口味优先</text>
<text x="545" y="288" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">明确标注代价</text>
<path d="M340 200 L340 216" fill="none" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="170" y="334" width="340" height="56" rx="8" fill="#412402" stroke="#EF9F27" stroke-width="0.5"/>
<text x="340" y="354" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="500" fill="#FAC775" text-anchor="middle" dominant-baseline="central">Step 4 · calculate-price 官方核价</text>
<text x="340" y="374" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#EF9F27" text-anchor="middle" dominant-baseline="central">原价 → 优惠 → 实付（含配送费）</text>
</g>
<path d="M135 310 L135 326 L300 326 L300 332" fill="none" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M545 310 L545 326 L380 326 L380 332" fill="none" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 310 L340 332" fill="none" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="200" y="414" width="280" height="40" rx="8" fill="#26215C" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="340" y="434" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" font-weight="500" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">Step 5 · 用户确认后才下单</text>
</g>
<path d="M340 390 L340 410" fill="none" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="424" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#888780">跨时区代点：</text>
<text x="40" y="442" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#888780">地址 → 门店 → 菜单 → 下单</text>
<text x="40" y="459" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#888780">地址不落盘</text>
</svg>
